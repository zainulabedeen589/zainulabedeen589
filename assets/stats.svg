<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Stats: 3+ projects shipped, 98% best model accuracy, 6 certifications, 1M+ records processed">
  <rect width="900" height="110" fill="#0A0D12"/>
  <rect x="0.5" y="0.5" width="899" height="109" fill="none" stroke="#232A35"/>

  <g font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0s" fill="freeze"/>
      <text x="112" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#4FD1C5">3+</text>
      <text x="112" y="82" text-anchor="middle" font-size="13" fill="#8D97A5" font-family="'Inter','Segoe UI',Arial,sans-serif">Projects shipped</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.25s" fill="freeze"/>
      <text x="337" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#4FD1C5">98%</text>
      <text x="337" y="82" text-anchor="middle" font-size="13" fill="#8D97A5" font-family="'Inter','Segoe UI',Arial,sans-serif">Best model accuracy</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" fill="freeze"/>
      <text x="562" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#4FD1C5">6</text>
      <text x="562" y="82" text-anchor="middle" font-size="13" fill="#8D97A5" font-family="'Inter','Segoe UI',Arial,sans-serif">Certifications</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.75s" fill="freeze"/>
      <text x="787" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#4FD1C5">1M+</text>
      <text x="787" y="82" text-anchor="middle" font-size="13" fill="#8D97A5" font-family="'Inter','Segoe UI',Arial,sans-serif">Records processed</text>
    </g>
  </g>

  <g stroke="#232A35">
    <line x1="225" y1="18" x2="225" y2="92"/>
    <line x1="450" y1="18" x2="450" y2="92"/>
    <line x1="675" y1="18" x2="675" y2="92"/>
  </g>

  <!-- sweeping highlight -->
  <rect y="0" width="90" height="110" fill="#4FD1C5" opacity="0.07">
    <animate attributeName="x" values="-90;900" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
