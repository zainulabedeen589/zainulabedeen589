<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Zainul Abedeen - Machine Learning Engineer">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7EAEE"/>
      <stop offset="1" stop-color="#4FD1C5"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="60" y="215" height="34" width="0">
        <animate attributeName="width" values="0;700;700;0" keyTimes="0;0.55;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="340" fill="#0A0D12"/>

  <!-- fluid-style drifting colour orbs (stand-in for the cursor fluid effect) -->
  <g filter="url(#blur)" opacity="0.45">
    <circle r="70" fill="#4FD1C5">
      <animate attributeName="cx" values="120;420;250;120" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;240;300;80" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" fill="#A855F7">
      <animate attributeName="cx" values="760;520;680;760" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;90;40;260" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle r="55" fill="#E8A659">
      <animate attributeName="cx" values="450;700;300;450" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;200;60;300" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0.5" y="0.5" width="899" height="339" fill="none" stroke="#232A35"/>

  <!-- availability tag with pulsing dot -->
  <circle cx="64" cy="60" r="9" fill="#4FD1C5" opacity="0.25">
    <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="60" r="3.5" fill="#4FD1C5"/>
  <text x="82" y="65" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#4FD1C5">Available for opportunities</text>

  <!-- title rises in -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="0.9s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    <text x="60" y="130" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="url(#title)">Turning raw data into</text>
    <text x="60" y="178" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="40" font-weight="700" fill="url(#title)">production-ready models.</text>
  </g>

  <!-- typing line -->
  <g clip-path="url(#typeclip)">
    <text x="60" y="238" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" fill="#8D97A5">Zainul Abedeen | ML Engineer | NLP | RAG | Evaluation</text>
  </g>
  <rect y="218" width="2" height="26" fill="#4FD1C5">
    <animate attributeName="x" values="60;760;760;60" keyTimes="0;0.55;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="296" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="14" fill="#8D97A5">Classification  ·  NLP  ·  Evaluation tooling  ·  Credit-risk pipelines on 1M+ records</text>
</svg>
