      <stop offset="0" stop-color="#4FD1C5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FD1C5"/>
      <stop offset="1" stop-color="#E8A659" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="900" y2="6" stroke="#232A35" stroke-width="1"/>
